# Active Implementation Guides — governance artifact.
#
# This list is the single source of truth for "which IGs are we currently
# tracking". The Tracker UI shows branch overlays (in the Timeline view) and
# any other repo-level views ONLY for the IGs listed here.
#
# Workflow when adding an IG to the governance scope:
#   1. Append a new entry below (the `repo` field is required; everything
#      else is descriptive metadata).
#   2. Re-run `npm run discover:repos` to refresh branch data — the discover
#      script reads this file and sets `relevant: true` automatically on
#      matching entries in public/data/repos.yaml.
#
# Workflow when removing an IG: delete its entry here, then re-run discover.
# The IG's branch overlay disappears immediately on next reload.
#
# Fields per entry:
#   repo         required — github "owner/name" (e.g. hl7-be/core)
#   package      optional — matching FHIR package id, when known
#   owner        optional — id of the workgroup that owns this IG. Must match
#                an `id` in public/data/groups.yaml (e.g. "core-wg",
#                "medication-wg"). Used by the Groups view.
#   description  optional — short purpose statement / governance context

activeIGs:
